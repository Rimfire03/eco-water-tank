name: Tank model
description: Share a custom tank so it can join the catalogue in a next release
title: "[Tank] "
body:
  - type: markdown
    attributes:
      value: |
        Generated by the integration (Share tank settings). Check the values, then submit.
  - type: input
    id: name
    attributes:
      label: Manufacturer and model
      description: With the commercial reference if any
    validations:
      required: true
  - type: input
    id: capacity
    attributes:
      label: Capacity (L)
    validations:
      required: true
  - type: input
    id: shape
    attributes:
      label: Shape (rectangular, circular or freeform)
  - type: input
    id: diameter
    attributes:
      label: Diameter (cm, circular)
  - type: input
    id: width
    attributes:
      label: Width (cm)
  - type: input
    id: length
    attributes:
      label: Length (cm)
  - type: input
    id: height
    attributes:
      label: Height (cm)
  - type: textarea
    id: curve
    attributes:
      label: Learned curve
      description: Litres per % for each 10 % of level (bottom to top)
    validations:
      required: true
  - type: textarea
    id: samples
    attributes:
      label: Learning samples per 10 % bin
      description: 0 means that bin was never learned (linear default there)
    validations:
      required: true
